# Top-level compose for animation-builder.
#
# Services:
#   * binfmt-init       — one-shot; registers x86_64 binfmt so qemu-user runs
#                         the retarget-worker on aarch64 hosts (the GB10).
#   * text-encoder      — upstream Kimodo LLM2Vec text encoder (port 9550, GPU)
#   * retarget-worker   — x86 sidecar running fbxsdkpy under qemu emulation;
#                         called over HTTP from animation-service. CPU only.
#   * animation-service — our FastAPI UI + retarget client (port 7870, GPU)
#   * demo              — upstream Kimodo single-clip Viser demo (port 7860,
#                         optional, omit from `up` to skip)
#
# Build order matters: text-encoder builds the upstream `kimodo:1.0` base
# image that animation-service consumes. Use scripts/start.sh on first run,
# or build manually:
#     docker compose build text-encoder
#     docker compose build animation-service retarget-worker
#     docker compose up -d animation-service text-encoder retarget-worker
#
# HuggingFace token: LLM2Vec (used by text-encoder) is a gated Meta model.
# Copy .env.example to .env and fill in your HF read-only token.

services:
  text-encoder:
    build:
      context: .
      dockerfile: docker/kimodo-base.Dockerfile
    image: kimodo:1.0
    container_name: text-encoder
    working_dir: /workspace
    # Patched launcher: forces Gradio queue default_concurrency_limit=1 so
    # the LLM2Vec model's CUDA tensors stay in the main process. Bare
    # upstream command would be `python -m kimodo.scripts.run_text_encoder_server`.
    command: python /workspace/text_encoder_patch.py
    volumes:
      - ./upstream:/workspace
      - hf_cache:/opt/hf-cache
      - ./app/text_encoder_patch.py:/workspace/text_encoder_patch.py:ro
    ports:
      - "9550:9550"
    environment:
      - HF_HOME=/opt/hf-cache
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      # Pin to a single GPU. LLM2Vec's encode() takes a multi-GPU branch
      # when torch.cuda.device_count() > 1 that spawns workers via
      # multiprocessing.Pool — those workers crash on rebuild_cuda_tensor
      # because CUDA tensor handles can't survive process boundaries.
      - NVIDIA_VISIBLE_DEVICES=${GPU_DEVICE:-0}
      - CUDA_VISIBLE_DEVICES=${GPU_DEVICE:-0}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Run as root inside the container so the gosu drop in upstream's
      # docker-entrypoint.sh skips creating a HOST_UID user. Otherwise the
      # entrypoint stats /workspace, gets mdmills' UID, then drops to that
      # user — but the named hf_cache volume is owned by root inside the
      # container and writes fail with PermissionError on first HF download.
      - HOST_UID=0
      - HOST_GID=0
    shm_size: "16gb"
    ipc: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -fsS http://localhost:9550/ > /dev/null"]
      interval: 3s
      timeout: 2s
      # Up to 10 minutes so first-run LLM2Vec download (~16 GB) finishes.
      retries: 200
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # FBX retarget sidecar: runs the FBX SDK Python bindings (Autodesk has no
  # aarch64 build) under FEX-Emu binary translation. The container itself
  # is aarch64 native — FEX is installed natively and runs the x86 python
  # process inside the container as a single FEX-emulated subprocess.
  # CPU only, no GPU access. Receives NPZ + template FBX over HTTP from
  # animation-service and returns the retargeted FBX bytes.
  #
  # FEX's binary recompiler (custom IR + direct ARM64 codegen) is faster
  # than qemu-user's TCG splatter-JIT for the kind of CPU-bound serialization
  # work fbxsdkpy does — community benchmarks show 2-3x. No --platform pin
  # needed (the container is native aarch64); no host binfmt registration
  # needed (FEX runs in-container via FEXBash).
  retarget-worker:
    build:
      context: .
      dockerfile: docker/retarget-worker.Dockerfile
    image: animation-builder/retarget-worker:2.0
    container_name: retarget-worker
    # Internal port only — animation-service reaches it via the compose
    # network DNS (http://retarget-worker:9560). No host bind needed.
    expose:
      - "9560"
    shm_size: "1gb"
    restart: unless-stopped
    healthcheck:
      # Healthcheck runs in the outer aarch64 container (no FEX), so use
      # native curl rather than a Python that doesn't exist outside the
      # x86 rootfs. Fast and cheap.
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:9560/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  animation-service:
    build:
      context: .
      dockerfile: docker/animation-service.Dockerfile
    container_name: animation-service
    working_dir: /workspace/animation-service
    ports:
      - "7870:7870"
    volumes:
      # Output storage lives in a named volume — no host filesystem
      # dependency. All FBX upload (POST /api/animations with the template)
      # and download (GET /api/animations/{id}/clip) flow through the web
      # API, which makes this deployable headless on a cloud GPU or a
      # GB10 without needing filesystem access to the host.
      - outputs:/workspace/animation-service/outputs
      - hf_cache:/opt/hf-cache
      # Live-mount the app + worker so iterating on Python doesn't require
      # an image rebuild. The image's COPY'd version is overlayed at runtime.
      - ./app:/workspace/animation-service/app:ro
      - ./worker:/workspace/worker:ro
      - ./scripts:/workspace/animation-service/scripts:ro
    environment:
      - TEXT_ENCODER_URL=http://text-encoder:9550/
      # Where animation-service reaches the x86 retarget sidecar. Set to a
      # different URL only if you're running the worker out-of-process for
      # debugging.
      - RETARGET_URL=http://retarget-worker:9560/retarget
      - HF_HOME=/opt/hf-cache
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - PYTHONPATH=/workspace/animation-service:/workspace
      - OUTPUT_ROOT=/workspace/animation-service/outputs
      # After the first run you can uncomment LOCAL_CACHE to skip the HF
      # online model-check each startup (Kimodo will only use the local
      # cache). See docs/KIMODO_REFERENCE.md footgun #12.
      # - LOCAL_CACHE=true
      - NVIDIA_VISIBLE_DEVICES=${GPU_DEVICE:-0}
      - CUDA_VISIBLE_DEVICES=${GPU_DEVICE:-0}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Run as root inside the container so the gosu drop in upstream's
      # docker-entrypoint.sh skips creating a HOST_UID user. Otherwise the
      # entrypoint stats /workspace, gets mdmills' UID, then drops to that
      # user — but the named hf_cache volume is owned by root inside the
      # container and writes fail with PermissionError on first HF download.
      - HOST_UID=0
      - HOST_GID=0
      # Post-processing is back ON. The simde -> NEON port produced wrong
      # cross products (broken foot orientation), so animation-service no
      # longer relies on the in-process motion_correction. Instead it
      # monkey-patches motion_correction.correct_motion to POST to
      # retarget-worker (FEX-Emu), where motion_correction is built
      # natively for x86 — no NEON guesswork. See app/postprocess_remote.py.
      - KIMODO_POST_PROCESSING=1
      - POSTPROCESS_URL=http://retarget-worker:9560/postprocess
    shm_size: "16gb"
    ipc: host
    restart: unless-stopped
    depends_on:
      text-encoder:
        condition: service_healthy
      retarget-worker:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Upstream Kimodo single-clip Viser demo, served alongside for
  # comparison. Optional — omit from `docker compose up` to skip.
  demo:
    image: kimodo:1.0
    container_name: kimodo-demo
    working_dir: /workspace
    command: python -m kimodo.demo
    volumes:
      - ./upstream:/workspace
      - hf_cache:/opt/hf-cache
      - ./upstream/checkpoints:/workspace/checkpoints:ro
    ports:
      - "${DEMO_PORT:-7860}:${DEMO_PORT:-7860}"
    environment:
      - TEXT_ENCODER_URL=http://text-encoder:9550/
      - SERVER_PORT=${DEMO_PORT:-7860}
      - HF_HOME=/opt/hf-cache
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - NVIDIA_VISIBLE_DEVICES=${GPU_DEVICE:-0}
      - CUDA_VISIBLE_DEVICES=${GPU_DEVICE:-0}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Run as root inside the container so the gosu drop in upstream's
      # docker-entrypoint.sh skips creating a HOST_UID user. Otherwise the
      # entrypoint stats /workspace, gets mdmills' UID, then drops to that
      # user — but the named hf_cache volume is owned by root inside the
      # container and writes fail with PermissionError on first HF download.
      - HOST_UID=0
      - HOST_GID=0
    shm_size: "16gb"
    ipc: host
    restart: unless-stopped
    depends_on:
      text-encoder:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  # Shared HuggingFace cache — Kimodo motion checkpoint (animation-service)
  # and LLM2Vec text encoder weights (text-encoder) coexist here so
  # downloads happen once even if both services start fresh.
  hf_cache: {}
  # All per-job data (uploaded template FBX, raw Kimodo NPZ, retargeted
  # FBX, metadata.json). Nothing on the host filesystem. To back up or
  # migrate, use `docker run --rm -v animation-builder_outputs:/d
  # -v $(pwd):/b alpine tar czf /b/outputs.tgz -C /d .` or
  # `docker cp animation-service:/workspace/animation-service/outputs .`.
  outputs: {}
